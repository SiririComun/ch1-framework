name: Build and Commit Chapter 1 PDF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: standalone.tex
          args: "-pdf -bibtex -interaction=nonstopmode"

      - name: Rename PDF to ch1_framework.pdf
        run: mv standalone.pdf ch1_framework.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ch1_framework
          path: ch1_framework.pdf

      - name: Commit and push compiled PDF to repository
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(ci): update compiled ch1_framework.pdf [skip ci]"
          file_pattern: "ch1_framework.pdf"
          add_options: '-f' # Force-adds PDF even if ignored in .gitignore